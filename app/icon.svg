<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    App icon — the same Radar mark as the sidebar brand (SidebarBrand), drawn
    with lucide's exact path geometry so the favicon and the in-app logo can
    never drift apart.

    Next.js App Router picks this file up automatically and injects the
    <link rel="icon"> tag; there is no manual <head> wiring.

    The plate matches the `primary` token in light mode. It stays dark in both
    themes on purpose: a browser tab is chrome, not page surface, and a mark that
    inverts with the theme reads as a different site.

    NOTE: keep double hyphens out of these comments — XML forbids them, and
    strict parsers (librsvg, used by the icon rasteriser) reject the file even
    though browsers let it slide.
  -->
  <rect width="32" height="32" rx="7" fill="#18181b" />
  <!--
    The mark fills ~72% of the plate rather than the ~56% the sidebar uses. A
    tab renders this at 16px, where the radar's arcs and its 2px centre dot are
    the first things to collapse — less padding and a heavier stroke buy back the
    legibility that size costs.
  -->
  <g
    transform="translate(5.5 5.5) scale(0.875)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" />
    <path d="M4 6h.01" />
    <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" />
    <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" />
    <path d="M12 18h.01" />
    <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" />
    <circle cx="12" cy="12" r="2" />
    <path d="m13.41 10.59 5.66-5.66" />
  </g>
</svg>
